<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>養蜂スクール｜さとのわ養蜂研究所</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #453516;
      text-align: center;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      background: linear-gradient(150deg, #fff9dc, #f3d77c);
    }

    main {
      width: min(680px, 100%);
      padding: 48px 24px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      box-shadow: 0 14px 40px rgba(90, 62, 10, 0.16);
    }

    .bee {
      font-size: 54px;
    }

    h1 {
      margin: 10px 0 6px;
      font-size: clamp(28px, 7vw, 44px);
    }

    h2 {
      margin: 24px 0 14px;
      color: #9a6500;
    }

    p {
      line-height: 1.9;
    }

    .notice {
      display: inline-block;
      margin: 14px 0;
      padding: 8px 18px;
      color: white;
      font-weight: bold;
      background: #c28a16;
      border-radius: 999px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      background: #75531a;
      border-radius: 999px;
    }

    .line {
      background: #06c755;
    }
  </style>
</head>

<body>
  <main>
    <div class="bee">🐝</div>

    <p class="notice">ただいま準備中です</p>

    <h1>さとのわ養蜂スクール</h1>
    <p>養蜂を楽しく、実践的に学べるスクールです。</p>

    <h2>卒業後もつづく、学びとつながり</h2>

    <p>
      養蜂家仲間との情報交換の場を、月に1回設けています。<br>
      素朴な疑問や最新情報などを持ち寄り、学び合える場を提供することで、<br>
      卒業後の養蜂活動も継続して支援していきます。
    </p>

    <p><strong>オンライン＆オフライン同時開催</strong></p>

    <div class="buttons">
      <a class="line" href="https://lin.ee/vTVBLSX">公式LINEで問い合わせる</a>
      <a href="../">ホームページへ戻る</a>
    </div>
  </main>
</body>
</html>
